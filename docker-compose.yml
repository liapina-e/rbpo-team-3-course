services:
  db:
    image: postgres:16
    container_name: tempshare-db
    environment:
      POSTGRES_USER: tempshare
      POSTGRES_PASSWORD: tempshare
      POSTGRES_DB: tempshare
    ports:
      - "5433:5432"
    volumes:
      - tempshare-pgdata:/var/lib/postgresql/data

volumes:
  tempshare-pgdata: