services:
  db:
    image: postgres:16
    container_name: tempshare-db
    environment:
      POSTGRES_USER: tempshare
      POSTGRES_PASSWORD: tempshare
      POSTGRES_DB: tempshare
    ports:
      - "5433:5432"
    volumes:
      - tempshare-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempshare -d tempshare"]
      interval: 5s
      timeout: 4s
      retries: 12

  api:
    image: tempshare-api:local
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=tempshare;Username=tempshare;Password=tempshare
      Jwt__Key: ${JWT_KEY:?JWT_KEY is not set, create .env from .env.example}
      Storage__Root: /app/storage
    volumes:
      - tempshare-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  tempshare-pgdata:
  tempshare-storage: